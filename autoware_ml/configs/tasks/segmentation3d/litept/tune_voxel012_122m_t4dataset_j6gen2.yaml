# @package _global_
defaults:
  - /tasks/segmentation3d/litept/voxel012_122m_t4dataset_j6gen2
  - _self_

# Every trial trains the same fixed budget so the study compares
# architectures rather than schedules; early stopping is off for the same
# reason. The schedule length follows the PTv3 study this one extends.
trainer:
  max_epochs: 12

callbacks:
  early_stopping: null

# The study reads per-class debris recall at validation, which the metric
# suites only break out at test by default.
t4dataset:
  segmentation3d:
    detail_stages: [val, test]

tuning:
  study_name: litept_seg3d_voxel012_122m_t4dataset_j6gen2
  storage: sqlite:///mlruns/optuna/litept_seg3d_voxel012_122m_t4dataset_j6gen2.db
  # Trained trials are measured later, so the sampler must not re-propose a
  # configuration that is still training: constant_liar treats running
  # trials as poor until they report.
  sampler:
    _target_: optuna.samplers.TPESampler
    seed: 42
    multivariate: true
    constant_liar: true
  search_space:
    _target_: autoware_ml.tuning.search_space.LitePTSearchSpace
    grid_sizes: [0.10, 0.12, 0.14, 0.16, 0.18]
    width_presets: [base, medium, tiny, small, micro]
    conv_depth_presets: [2-2-2, 1-1-1]
    attn_depth_presets: [6-2, 4-2, 2-2, 2-1]
    dec_depth_presets: [none, light]
    patch_sizes: [256, 512, 1024]
    mlp_ratios: [2, 3, 4]
    rope_base_range: [10.0, 1000.0]
    stem_types: [linear, conv]
    conv_stem_kernel_size: 3
  objectives:
    - { name: latency_ms, direction: minimize, source: latency }
    - { name: val/seg3d/mIoU, direction: maximize, source: metric }
    - { name: val/seg3d/recall_debris, direction: maximize, source: metric }
  # Soft bound the sampler is told about; a trial below it still reports its
  # objectives so nothing measured is thrown away.
  constraints:
    - { metric: val/seg3d/recall_debris, min: 0.4 }
  # Reject a proposal before it spends a training slot; null disables.
  static_filter:
    max_encoder_params: null
  # Eager PyTorch proxy for the deployed latency; fp32 ranks architectures
  # the same way and avoids the spconv fp16 tuner failure seen under autocast.
  latency:
    frames: 50
    warmup: 10
    repeats: 5
    precision: fp32
  measure:
    max_attempts: 3
  train_overrides: []
  # Known-good parametrizations queued first, so the study can reproduce
  # what it is asked to beat. Values must lie inside the search space.
  reference_trials:
    litept_tiny:
      grid_size: 0.12
      width_preset: tiny
      conv_depth_preset: 2-2-2
      attn_depth_preset: 2-2
      dec_depth_preset: light
      patch_size: 512
      mlp_ratio: 4
      rope_base: 100.0
      stem_type: linear
    litept_base:
      grid_size: 0.12
      width_preset: base
      conv_depth_preset: 2-2-2
      attn_depth_preset: 6-2
      dec_depth_preset: none
      patch_size: 1024
      mlp_ratio: 4
      rope_base: 100.0
      stem_type: linear
